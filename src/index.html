<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prêt'Adopte</title>
  <base href="/">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body class="text-base bg-amber-50">
  <app-root></app-root>
</body>
</html>

<script>
  window.onerror = function(msg, src, line, col, err) {
    document.body.insertAdjacentHTML('afterbegin',
      `<div style="background:red;color:white;padding:10px;z-index:9999;position:fixed;top:0;left:0;right:0;font-size:12px;word-break:break-all">
        ${msg} — ${src}:${line}
      </div>`
    );
  };
</script>
