<div
  class="relative rounded-xl overflow-hidden min-h-10 w-full h-full"
  [ngClass]="[borderColor() ?? '', borderSize() ?? '',
  backgroundBlur() ? 'bg-white/10 backdrop-blur-sm' : '',
  backgroundColor() ? '!' + backgroundColor() : 'bg-white']"
>
    <div [ngClass]="['absolute z-0 w-full h-full']">
      @if (backgroundImage()) {
        <img [src]="backgroundImage()" alt="Image broken" class="object-cover w-full h-full">
        @if(backgroundImageHaze()) {
          <div class="absolute inset-0
          bg-linear-to-b from-[rgba(139,110,40,0.25)] to-[rgba(80,90,40,0.45)]"
          ></div>
        }
      }
    </div>

  <div class="relative z-10 w-full h-full px-8 py-6
  [@media(max-width:783px)]:py-10 [@media(max-width:783px)]:px-4 "
  >
    <ng-content></ng-content>
  </div>
</div>
