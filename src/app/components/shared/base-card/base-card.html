<div class="relative rounded-xl overflow-hidden min-w-80 min-h-10 w-full h-full"
      [ngClass]="[ borderColor() ?? '', borderSize() ?? '']"
>
  @if (backgroundImage()) {
    <div class="absolute z-0 w-full h-full">
      <img [src]="backgroundImage()" alt="Card Background" class="object-cover w-full h-full">
    </div>
  } @else {
    <div class="absolute z-0 w-full h-full bg-gray-200"></div>
  }
  <div class="relative z-10 w-full h-full px-8 py-6
  [@media(max-width:783px)]:py-10 [@media(max-width:783px)]:px-4 "
  >
    <ng-content></ng-content>
  </div>
</div>
