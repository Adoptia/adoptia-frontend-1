<section
  class="relative flex flex-col items-center justify-between
  h-full w-full min-h-40 min-w-80 max-h-120 max-w-200 px-4 py-8
  rounded-3xl overflow-hidden">
  <div class="bg-white/10 backdrop-blur-xl w-full h-full absolute inset-0 pointer-events-none">
  </div>
  <div class="relative z-10 text-shadow-white text-2xl w-full pb-8 px-4 text-center font-bold
  sm:px-16 [@media(max-width:783px)]:text-lg"
  >
    {{ data().question }}
  </div>

  @let answers = data().answers;

  <div class="relative z-10 w-full px-16 overflow-y-auto h-max-1/3">
    @for (a of answers; track $index) {
      <p (click)="toggleSelectAnswer(a)"
         [ngClass]="[
         isCardSubmitted()
         ? 'cursor-default' : 'cursor-pointer',
         !answerIsSelected(a)
         ? 'bg-black/40 text-shadow-white' : '',
         !isCardSubmitted() && answerIsSelected(a)
         ? 'bg-white/80 text-black' : '',
         !isCardSubmitted() && !answerIsSelected(a)
         ? 'hover:bg-black/60' : '',
         isCardSubmitted() && answerIsSelected(a) && a.isCorrect
         ? 'bg-green-800 text-shadow-white' : '',
         (isCardSubmitted() && answerIsSelected(a) && !a.isCorrect)
         ? 'bg-red-400 text-shadow-white' : '',
         'mb-4 text-center rounded-4xl px-4 py-2 transition-colors duration-300'
         ]"
      >{{ a.text }}</p>
    }
  </div>

  <div class="flex justify-center w-full pt-8">
    <p-button [disabled]="emptyAnswer() || isCardSubmitted()"
              (click)="submitCard()" [size]="'large'" [label]="'Valider'"
              [rounded]="true" [severity]="'contrast'" [raised]="true"
              styleClass="!text-white !px-8 !bg-black transition-colors duration-300
              hover:!text-black hover:!bg-white active:!bg-white active:!text-black
              disabled:hover:!bg-black disabled:hover:!text-white !border-none"
    />
  </div>
</section>
