<div class="relative rounded-xl overflow-hidden min-w-60 min-h-10 w-full h-full"
      [ngClass]="[ borderColor() ?? '', borderSize() ?? '']"
>
  @if (backgroundImage()) {
    <div class="absolute z-0 w-full h-fit">
      <img [src]="backgroundImage()" alt="Card Background" class="h-full w-full">
    </div>
  } @else {
    <div class="absolute z-0 w-full h-full bg-gray-200"></div>
  }
  <div class="relative z-10 w-full h-full px-8 py-4">
    <ng-content></ng-content>
  </div>
</div>
